      <path d="M145 68h17l-27 46h-3v-12z"/>
      <path d="M216 68h14l-27 46h-1v-14z"/>
      <path d="M273 68h13l-28 46h-0v-12z"/>
    </g>

    <!-- portas e macanetas -->
    <path d="M199 58v136M252 60v134" stroke="#EADDD4" stroke-width="2" stroke-linecap="round"/>
    <rect x="180" y="158" width="14" height="5" rx="2.5" fill="#CDBDB2"/>
    <rect x="260" y="158" width="14" height="5" rx="2.5" fill="#CDBDB2"/>

    <!-- retrovisor -->
    <path d="M303 108h9c5 0 8 3 8 7v7c0 4-3 6-6 6h-6c-4 0-6-3-6-6z" fill="#FF5A1F"/>
    <path d="M303 108h9c5 0 8 3 8 7" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>

    <!-- farol e lanterna -->
    <ellipse cx="370" cy="147" rx="9" ry="8" fill="#FFF3C8" stroke="#EBDDC6" stroke-width="1.5"/>
    <circle cx="367" cy="144" r="2.6" fill="#FFFFFF"/>
    <rect x="44" y="132" width="7" height="30" rx="3.5" fill="#E5484D"/>

    <!-- para-choques -->
    <rect x="350" y="188" width="48" height="15" rx="7.5" fill="#3A3C42"/>
    <rect x="30" y="188" width="46" height="15" rx="7.5" fill="#3A3C42"/>
  </g>

  <!-- caixas de roda -->
  <path d="M64 200a46 46 0 0 1 92 0z" fill="#2E2926"/>
  <path d="M268 200a46 46 0 0 1 92 0z" fill="#2E2926"/>

