  <g class="vv-wheel">
    <circle cx="314" cy="200" r="34" fill="url(#vv-tire)"/>
    <circle cx="314" cy="200" r="19" fill="url(#vv-hub)"/>
    <circle cx="314" cy="200" r="7.5" fill="#FF5A1F"/>
    <g fill="#B5ABA3">
      <circle cx="314" cy="188.5" r="2.3"/><circle cx="324.9" cy="196.4" r="2.3"/><circle cx="320.8" cy="209.3" r="2.3"/><circle cx="307.2" cy="209.3" r="2.3"/><circle cx="303.1" cy="196.4" r="2.3"/>
