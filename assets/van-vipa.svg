    <text x="170" y="146.5" fill="#FFFFFF" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2" text-anchor="middle">VIPA</text>

    <!-- janelas -->
    <rect x="60" y="68" width="62" height="46" rx="12" fill="url(#vv-glass)"/>
    <rect x="132" y="68" width="62" height="46" rx="12" fill="url(#vv-glass)"/>
    <rect x="204" y="68" width="42" height="46" rx="12" fill="url(#vv-glass)"/>
    <path d="M258 80c0-7 5-12 12-12h7c5 0 9 2 12 6l23 32c3 4 0 8-4 8h-38c-7 0-12-5-12-12z" fill="url(#vv-glass)"/>
    <g fill="#FFFFFF" opacity=".17">
