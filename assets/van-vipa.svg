<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" fill="none">
  <defs>
    <linearGradient id="vv-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#FFFCFA"/>
      <stop offset="1" stop-color="#F3E9E2"/>
    </linearGradient>
    <linearGradient id="vv-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A2E0A" stop-opacity=".07"/>
      <stop offset=".14" stop-color="#7A2E0A" stop-opacity="0"/>
      <stop offset=".86" stop-color="#7A2E0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A2E0A" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="vv-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A26"/>
      <stop offset="1" stop-color="#E8440F"/>
    </linearGradient>
    <linearGradient id="vv-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4C61"/>
      <stop offset="1" stop-color="#1B2530"/>
    </linearGradient>
    <radialGradient id="vv-hub" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6CEC7"/>
    </radialGradient>
    <radialGradient id="vv-tire" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#3A3A40"/>
      <stop offset="1" stop-color="#1E1E22"/>
    </radialGradient>
    <radialGradient id="vv-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5A1E00" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5A1E00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="vv-shape">
      <path d="M44 182V90c0-22 17-40 40-40h160c14 0 25 6 33 17l38 52c4 5 10 9 17 10l16 3c19 4 30 16 30 34v14c0 11-8 18-19 18H60c-10 0-16-6-16-16z"/>
    </clipPath>
  </defs>

  <ellipse cx="212" cy="233" rx="186" ry="13" fill="url(#vv-shadow)"/>

  <g class="vv-body">
    <path d="M44 182V90c0-22 17-40 40-40h160c14 0 25 6 33 17l38 52c4 5 10 9 17 10l16 3c19 4 30 16 30 34v14c0 11-8 18-19 18H60c-10 0-16-6-16-16z" fill="url(#vv-body)"/>
    <g clip-path="url(#vv-shape)">
