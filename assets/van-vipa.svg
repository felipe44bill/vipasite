  <g class="vv-wheel">
    <circle cx="110" cy="200" r="34" fill="url(#vv-tire)"/>
    <circle cx="110" cy="200" r="19" fill="url(#vv-hub)"/>
    <circle cx="110" cy="200" r="7.5" fill="#FF5A1F"/>
    <g fill="#B5ABA3">
      <circle cx="110" cy="188.5" r="2.3"/><circle cx="120.9" cy="196.4" r="2.3"/><circle cx="116.8" cy="209.3" r="2.3"/><circle cx="103.2" cy="209.3" r="2.3"/><circle cx="99.1" cy="196.4" r="2.3"/>
    </g>
