      <rect x="34" y="166" width="370" height="1.5" fill="#EADCD2"/>
      <rect x="34" y="128" width="370" height="25" fill="url(#vv-stripe)"/>
      <rect x="34" y="128" width="370" height="3" fill="#FFFFFF" opacity=".32"/>
